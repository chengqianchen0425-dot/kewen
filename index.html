<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="英语老师的备课台：AI 写课文或贴现成文章，逐词注释、考频标色、核心词汇、练习、讲义和默写卡。">
<title>课文工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
</head>
<body>
<style>
/* Layout: a teacher's lesson-prep desk. Composer across the top (words, level, one big button), then the annotated lesson in the middle with an always-visible tool rail on the right (export, display, redo). Desk is faint exercise-book grid paper; primary actions in fountain-pen blue; target words are marked the way a teacher marks them, with a red wavy pen line. */
:root{
  --desk:#EEF1EC; --grid:rgba(39,71,168,.06);
  --sheet:#FFFFFF; --sheet-2:#F7F8FA;
  --ink:#1B2440; --ink-2:#5C6681; --rule:#DCE1E8;
  --pen:#2747A8; --pen-ink:#FFFFFF; --pen-soft:#E8EDFB; --pen-deep:#1C3580;
  --red:#D2433A; --marker:#FFE36E;
  --hi:#F6CDBF;  --hi-ink:#8E2F16;
  --mid:#CDEBD6; --mid-ink:#1F6A3F;
  --low:#D3E2F7; --low-ink:#24508A;
  --bas:#E8EAEE; --bas-ink:#566074;
  --out:#EAD9F3; --out-ink:#62307E;
  --ok:#2E7D4F; --warn:#B4541A;
  --ui:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --read:"Literata","Georgia","Times New Roman",serif;
  --display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --r:14px;
  --shadow:0 1px 2px rgba(27,36,64,.06),0 8px 24px -12px rgba(27,36,64,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#11151F; --grid:rgba(140,165,255,.05); --sheet:#1A2030; --sheet-2:#20273A;
    --ink:#E6EAF5; --ink-2:#9AA4BE; --rule:#2E3650;
    --pen:#7D9BFF; --pen-ink:#0E1426; --pen-soft:#24305A; --pen-deep:#A9BCFF; --red:#FF7A6E; --marker:#7D6A16;
    --hi:#5A2E22; --hi-ink:#FFC9B6; --mid:#1F4A33; --mid-ink:#A9E6C2; --low:#203B5C; --low-ink:#B8D4FA;
    --bas:#2B3245; --bas-ink:#C2CAE0; --out:#43284F; --out-ink:#E7C8F7; --ok:#5CC48A; --warn:#F0A060;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#11151F; --grid:rgba(140,165,255,.05); --sheet:#1A2030; --sheet-2:#20273A;
  --ink:#E6EAF5; --ink-2:#9AA4BE; --rule:#2E3650;
  --pen:#7D9BFF; --pen-ink:#0E1426; --pen-soft:#24305A; --pen-deep:#A9BCFF; --red:#FF7A6E; --marker:#7D6A16;
  --hi:#5A2E22; --hi-ink:#FFC9B6; --mid:#1F4A33; --mid-ink:#A9E6C2; --low:#203B5C; --low-ink:#B8D4FA;
  --bas:#2B3245; --bas-ink:#C2CAE0; --out:#43284F; --out-ink:#E7C8F7; --ok:#5CC48A; --warn:#F0A060;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;
  background-color:var(--desk);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 56px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}

/* ---------- app bar ---------- */
.appbar{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--pen);color:var(--pen-ink);display:grid;place-items:center;font-family:var(--display);font-size:21px;font-weight:700;flex:none}
.brand b{display:block;font-family:var(--display);font-size:20px;line-height:1.2}
.brand small{display:block;color:var(--ink-2);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:13px;box-shadow:var(--shadow)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pill .dot.off{background:var(--warn)}

/* ---------- composer ---------- */
.composer{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.c-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.modes{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--sheet-2);border:1px solid var(--rule);border-radius:10px;padding:3px}
.modes button{border:0;background:none;border-radius:8px;padding:6px 14px;font-size:14px;color:var(--ink-2)}
.modes button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(27,36,64,.14)}
.demos{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.demos button{border:1px dashed var(--rule);background:none;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink)}
.demos button[aria-pressed="true"]{border-style:solid;border-color:var(--pen);color:var(--pen);font-weight:700}
.c-main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:14px;align-items:end}
.c-main.paste{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.c-main{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lab{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--ink-2)}
textarea,input[type="text"],input[type="password"],input[type="url"],select{width:100%;background:var(--sheet-2);border:1px solid var(--rule);border-radius:10px;padding:9px 12px}
#words{min-height:46px;height:46px;resize:vertical;font-family:var(--read);font-size:16px;line-height:1.5}
#article{min-height:170px;resize:vertical;font-family:var(--read);font-size:16px;line-height:1.6}
.lab-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lab-row label{font-size:13px;font-weight:700}
.lab-actions{margin-left:auto;display:flex;gap:12px;align-items:center}
.clearbtn{border:1px solid var(--rule);background:var(--sheet-2);border-radius:8px;padding:3px 12px;font-size:13px;color:var(--ink-2)}
.clearbtn:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.clearbtn:disabled{opacity:.45;cursor:default}
.paste-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){.paste-row{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--rule);background:var(--sheet-2);border-radius:999px;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.go{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--pen);background:var(--pen);color:var(--pen-ink);border-radius:10px;padding:9px 18px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--pen-deep);border-color:var(--pen-deep)}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{padding:12px 26px;font-size:16px}
.btn.ghost{background:transparent;color:var(--pen)}
.btn.ghost:hover{background:var(--pen-soft)}
.btn.sm{padding:5px 12px;font-size:13px;font-weight:500}
.linkbtn{border:0;background:none;color:var(--pen);font-size:13px;padding:4px 0}
.c-foot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.status{font-size:13px;color:var(--ink-2)}
.status.err{color:var(--warn)}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.check input{accent-color:var(--pen);width:16px;height:16px;flex:none}
.more{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.6fr) minmax(0,.6fr) minmax(0,1fr);gap:14px;padding-top:12px;border-top:1px dashed var(--rule)}
@media (max-width:980px){.more{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* ---------- workspace ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;overflow:hidden}
.head{padding:24px 28px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--rule)}
.flag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--red);border:1px solid currentColor;border-radius:4px;padding:0 7px;transform:rotate(-2deg)}
.title-en{margin:0;font-family:var(--read);font-weight:600;font-size:30px;line-height:1.2;text-wrap:balance}
.title-cn{margin:0;font-family:var(--display);font-size:19px;font-weight:700;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;margin-top:4px}
.stats .total{font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.lv{border-radius:6px;padding:1px 9px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;border:1.5px solid transparent}
button.lv{cursor:pointer}
button.lv[aria-pressed="true"]{border-color:currentColor}
.lv-h{background:var(--hi);color:var(--hi-ink)} .lv-m{background:var(--mid);color:var(--mid-ink)}
.lv-l{background:var(--low);color:var(--low-ink)} .lv-b{background:var(--bas);color:var(--bas-ink)} .lv-x{background:var(--out);color:var(--out-ink)} .lv-p{background:var(--marker);color:var(--ink)}
.legend button.lv[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.cover{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.cover .w{border-radius:6px;padding:0 8px;border:1px solid var(--rule);font-family:var(--read)}
.cover .yes{border-color:var(--ok);color:var(--ok)} .cover .no{border-color:var(--warn);color:var(--warn)}

.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--rule);overflow-x:auto;background:var(--sheet)}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:12px 14px 10px;font-size:15px;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen);font-weight:700}
.tabs .n{font-size:11px;color:var(--ink-2);margin-left:3px;font-weight:400}
.pane{padding:24px 28px 30px}

/* interlinear reader */
.reader .para{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-start;margin:0 0 22px;padding-left:2em}
.reader .sent{display:contents}
.tok{display:inline-flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;color:inherit}
.tok .t{font-family:var(--read);font-size:20px;line-height:1.35;padding:1px 4px;border-radius:5px;border-bottom:1.5px dashed transparent;transition:opacity .15s}
.tok .g{font-size:12.5px;color:var(--ink-2);line-height:1.3;min-height:1.3em;white-space:nowrap;margin-top:3px}
.tok.has-g .t{border-bottom-color:var(--rule)}
.tok:hover .t{filter:brightness(.96)}
.tok.lv-h,.tok.lv-m,.tok.lv-l,.tok.lv-b,.tok.lv-x{background:none}
.tok.lv-h .t{background:var(--hi);color:var(--hi-ink)} .tok.lv-m .t{background:var(--mid);color:var(--mid-ink)}
.tok.lv-l .t{background:var(--low);color:var(--low-ink)} .tok.lv-b .t{background:var(--bas);color:var(--bas-ink)} .tok.lv-x .t{background:var(--out);color:var(--out-ink)}
.tok.target .t{font-weight:600;text-decoration:underline wavy var(--red);text-decoration-thickness:1.5px;text-underline-offset:5px}
.tok.lv-p .t{background:var(--marker);color:var(--ink)}
.reader.editing .tok{cursor:crosshair}
.reader.editing .tok .t{outline:1px dashed var(--rule)}
.reader.hide-h .tok.lv-h .t,.reader.hide-m .tok.lv-m .t,.reader.hide-l .tok.lv-l .t,.reader.hide-b .tok.lv-b .t,.reader.hide-x .tok.lv-x .t,.reader.hide-p .tok.lv-p .t{background:none!important;color:inherit!important}
.reader.no-gloss .tok .g{display:none}
.reader.no-color .tok .t{background:none!important;color:inherit!important}
.reader[data-focus] .tok .t{background:none!important;color:var(--ink-2)!important;opacity:.5}
.reader[data-focus="h"] .tok.lv-h .t{background:var(--hi)!important;color:var(--hi-ink)!important;opacity:1}
.reader[data-focus="m"] .tok.lv-m .t{background:var(--mid)!important;color:var(--mid-ink)!important;opacity:1}
.reader[data-focus="l"] .tok.lv-l .t{background:var(--low)!important;color:var(--low-ink)!important;opacity:1}
.reader[data-focus="b"] .tok.lv-b .t{background:var(--bas)!important;color:var(--bas-ink)!important;opacity:1}
.reader[data-focus="x"] .tok.lv-x .t{background:var(--out)!important;color:var(--out-ink)!important;opacity:1}
.reader[data-focus="p"] .tok.lv-p .t{background:var(--marker)!important;color:var(--ink)!important;opacity:1}
.reader[data-focus] .tok.target .t{opacity:1;color:var(--ink)!important}
.sent.reading .tok .t{outline:2px solid var(--pen)}

.player{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 28px calc(12px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--rule);background:var(--sheet)}
.player .round{width:44px;height:44px;border-radius:50%;border:0;background:var(--pen);color:var(--pen-ink);display:grid;place-items:center}
.player .round svg{width:18px;height:18px;fill:currentColor}
.player .ic{width:36px;height:36px;border-radius:9px;border:1px solid var(--rule);background:var(--sheet-2);display:grid;place-items:center}
.player .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.player .ic[aria-pressed="true"]{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.player .pos{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-left:auto}
.player select{width:auto;padding:5px 8px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vcard{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:var(--sheet)}
.vcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vcard .w{font-family:var(--read);font-size:22px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.vcard .tgt{font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 5px}
.vcard .ph{font-family:var(--read);color:var(--ink-2);font-size:14px}
.say{display:flex;gap:6px;flex:none}
.say button{border:1px solid var(--rule);background:var(--sheet-2);border-radius:8px;padding:3px 8px;font-size:12.5px;display:flex;gap:3px;align-items:center}
.say svg{width:13px;height:13px;fill:currentColor}
.vcard .mean{margin:4px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.75}
.vcard .ctx{font-size:13px;color:var(--pen);background:var(--pen-soft);border-radius:6px;padding:2px 8px;align-self:flex-start}

.notes{display:flex;flex-direction:column;gap:16px}
.note{border-left:3px solid var(--pen);padding:2px 0 2px 14px}
.note .pt{font-family:var(--read);font-weight:600;font-size:17px;margin:0}
.note .ex{margin:2px 0 0;font-size:14.5px}
.note .eg{margin:4px 0 0;font-family:var(--read);font-style:italic;color:var(--ink-2)}
.note .qt{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.note .qt span{font-family:var(--read)}
.note-group + .note-group{margin-top:22px}
.note-group .notes{margin-top:4px}

.shadow-note{font-size:13px;color:var(--ink-2);background:var(--sheet-2);border:1px dashed var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 14px}
.scard{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.scard .en{font-family:var(--read);font-size:18px;font-weight:600;line-height:1.5;margin:0}
.scard .zh{margin:6px 0 10px;color:var(--ink-2)}
.scard .row{display:flex;gap:8px;flex-wrap:wrap}

.sec-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 10px}
.sec-h::before{content:"";width:4px;height:18px;background:var(--pen);border-radius:2px}
.prose p{font-family:var(--read);font-size:17px;line-height:1.85;text-indent:2em;margin:0 0 10px;max-width:70ch}
.prose.zh p{font-family:var(--ui);font-size:16px}
.prose + .sec-h{margin-top:24px}

.qs{display:flex;flex-direction:column;gap:18px;margin:0;padding:0;list-style:none;counter-reset:q}
.qs > li{counter-increment:q}
.qs .q{font-family:var(--read);font-size:16px;font-weight:600;margin:0 0 6px}
.qs .q::before{content:counter(q) ". "}
.qs .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-family:var(--read)}
@media (max-width:600px){.qs .opts{grid-template-columns:minmax(0,1fr)}}
.qs .key{margin-top:8px;font-size:14px;border-left:3px solid var(--red);background:var(--sheet-2);padding:6px 10px}
.qs .key b{color:var(--red)}
.empty{color:var(--ink-2)}

/* ---------- tool rail ---------- */
.rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(16px + env(safe-area-inset-top, 0px))}
@media (max-width:980px){.rail{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.rcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px}
.rcard h3{margin:0 0 2px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.act{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--rule);background:var(--sheet-2);border-radius:10px;padding:9px 11px}
.act:hover{border-color:var(--pen);background:var(--pen-soft)}
.act svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--pen);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act span{display:flex;flex-direction:column;min-width:0}
.act b{font-size:14px}
.act small{font-size:12px;color:var(--ink-2);line-height:1.35}
.act.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.act.primary svg{stroke:var(--pen-ink)}
.act.primary small{color:var(--pen-ink);opacity:.8}
.act.primary:hover{background:var(--pen-deep)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12px;color:var(--ink-2);align-items:center}
.recent{display:flex;flex-direction:column;gap:4px}
.recent button{text-align:left;background:none;border:0;border-radius:8px;padding:5px 6px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent button:hover{background:var(--pen-soft)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,21,31,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top, 0px)) 16px 24px;overflow:auto}
.dialog{background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow);width:100%;max-width:860px;display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.dialog.narrow{max-width:460px}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule)}
.d-head h2{margin:0;font-family:var(--display);font-size:18px}
.d-close{border:0;background:none;font-size:22px;line-height:1;color:var(--ink-2);padding:4px 8px}
.d-body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.d-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--rule);flex-wrap:wrap}
.preview{font-size:14px}
.preview table{border-collapse:collapse;width:100%;min-width:520px}
.preview th,.preview td{border:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.preview th{background:var(--sheet-2)}
.preview h1{font-family:var(--read);font-size:22px}
.preview h4{margin:16px 0 6px;font-size:15px}
.preview .blank{display:inline-block;width:110px;border-bottom:1px solid var(--ink)}
.preview-scroll{overflow-x:auto}

/* PDF render surface: always light, A4 width */
.pdf-sheet{width:700px;box-sizing:border-box;background:#fff;color:#1B2440;font-family:var(--ui);font-size:13.5px;line-height:1.65;padding:4px 6px}
.pdf-sheet h1{font-family:var(--read);font-size:24px;margin:0 0 4px}
.pdf-sheet h4{font-size:15px;margin:18px 0 6px;padding-bottom:3px;border-bottom:1px solid #9AA3B5}
.pdf-sheet p{margin:0 0 8px}
.pdf-sheet table{border-collapse:collapse;width:100%}
.pdf-sheet th,.pdf-sheet td{border:1px solid #9AA3B5;padding:5px 7px;text-align:left;vertical-align:top;font-size:12.5px}
.pdf-sheet th{background:#EEF1F6}
.pdf-sheet .blank{display:inline-block;width:110px;border-bottom:1px solid #1B2440}
.pdf-annot{margin:6px 0 10px}
.pdf-annot .pp{display:flex;flex-wrap:wrap;gap:3px 6px;margin:0 0 12px}
.pdf-annot .w{display:inline-flex;flex-direction:column;align-items:center}
.pdf-annot .w b{font-family:var(--read);font-weight:400;font-size:16px;padding:0 3px;border-radius:3px;line-height:1.35}
.pdf-annot .w i{font-style:normal;font-size:10.5px;color:#5C6681;min-height:1.2em;white-space:nowrap}
.pdf-annot .w.tg b{font-weight:600;text-decoration:underline wavy #D2433A;text-underline-offset:4px}
.pdf-legend{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;margin:0 0 8px}
.pdf-legend span{padding:0 6px;border-radius:3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.copy-fallback{width:100%;min-height:180px;font-family:var(--read)}
@media (max-width:600px){.pane,.head{padding-inline:16px}.player{padding-inline:16px}.reader .para{padding-left:0}.tok .t{font-size:18px}.tabs{padding:0 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ===================================================================
   课文工坊
   - 考频：本地词库 data/vocab.json（由 ECDICT 精简，MIT 协议）
   - AI：Claude（在 Claude 里打开时）/ OpenAI 兼容接口 / 自己的 Cloudflare Worker
   =================================================================== */
const ZK = 1, GK = 2, C4 = 4, C6 = 8, IE = 16, TF = 32;
const LEVELS = [
  { id: "p1", label: "小学低年级", desc: "Chinese primary school grades 1-3, CEFR Pre-A1. Very short simple sentences, mostly present tense, only the most basic ~300 words.",
    inS: e => (e.m & ZK) && e.f > 0 && e.f <= 600, inB: e => e.f > 0 && e.f <= 100 },
  { id: "p2", label: "小学高年级", desc: "Chinese primary school grades 4-6, CEFR A1. Short sentences, simple past and future allowed, basic everyday vocabulary.",
    inS: e => (e.m & ZK) && e.f > 0 && e.f <= 1500, inB: e => e.f > 0 && e.f <= 200 },
  { id: "j", label: "初中", desc: "Chinese junior high school (中考 level), CEFR A2-B1. Compound sentences and common clauses are fine; vocabulary within the junior high syllabus.",
    inS: e => e.m & ZK, inB: e => (e.m & ZK) && e.f > 0 && e.f <= 300 },
  { id: "s", label: "高中", desc: "Chinese senior high school (高考 level), CEFR B1-B2. Varied structures with some clauses; vocabulary within the senior high syllabus (~3500 words).",
    inS: e => e.m & (ZK | GK), inB: e => (e.m & ZK) && e.f > 0 && e.f <= 1200 },
  { id: "c", label: "四六级", desc: "Chinese college English CET-4/CET-6 level, CEFR B2. Natural general and academic English.",
    inS: e => e.m & (ZK | GK | C4 | C6), inB: e => e.m & ZK },
  { id: "i", label: "雅思托福", desc: "IELTS/TOEFL level, CEFR B2-C1. Rich, precise vocabulary and complex sentences.",
    inS: e => e.m & (ZK | GK | C4 | C6 | IE | TF), inB: e => e.m & (ZK | GK) }
];
const GENRES = [
  { id: "story", label: "故事", desc: "a short narrative story" },
  { id: "dialogue", label: "对话", desc: "a dialogue between two or three people; each sentence object is one spoken line beginning with the speaker's name and a colon" },
  { id: "expo", label: "说明文", desc: "an expository text that explains something, like a textbook reading passage" },
  { id: "news", label: "新闻", desc: "a short news report" },
  { id: "letter", label: "书信邮件", desc: "a letter or email with greeting and sign-off" },
  { id: "argue", label: "议论文", desc: "an argumentative essay with a clear opinion and reasons" }
];
const LV = { h: "高频", m: "中频", l: "低频", b: "基础", x: "超纲", p: "手动标记" };
const LV_DESC = { h: "本阶段词表里最常见的一档", m: "本阶段词表里中间一档", l: "本阶段词表里较少见的一档", b: "前一阶段学过的常用词", x: "本阶段词表以外", p: "你自己点上的" };
const STOP = new Set("a an the and or but so if as of to in on at by for from with into about than then is am are was were be been being do does did have has had i you he she it we they me him her us them my your his its our their this that these those there here not no yes can could will would shall should may might must just very too also oh".split(" "));
let level = "j", genre = "story", mode = "gen";

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const parseWords = s => [...new Set(s.split(/[\n,，、;；]+/).map(w => w.trim()).filter(Boolean))].slice(0, 30);
const levelOf = id => LEVELS.find(l => l.id === id) || LEVELS[2];
const genreOf = id => GENRES.find(g => g.id === id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------------- local dictionary ---------------- */
let VOC = null; const tierCache = {};
function entry(lemma) { const v = VOC && VOC.w[lemma]; return v ? { m: v[0], f: v[1], ph: v[2], tr: v[3] } : null; }
function lemmaOf(raw) {
  let w = String(raw).toLowerCase().replace(/[’]/g, "'").replace(/^[^a-z]+|[^a-z]+$/g, "");
  if (!w) return "";
  w = w.replace(/'s$|'$/, "");
  if (!VOC) return w;
  if (VOC.lem[w]) return VOC.lem[w];
  if (VOC.w[w]) return w;
  const tries = [];
  if (w.endsWith("ies")) tries.push(w.slice(0, -3) + "y");
  if (w.endsWith("es")) tries.push(w.slice(0, -2));
  if (w.endsWith("s")) tries.push(w.slice(0, -1));
  if (w.endsWith("ied")) tries.push(w.slice(0, -3) + "y");
  if (w.endsWith("ed")) tries.push(w.slice(0, -2), w.slice(0, -1), w.slice(0, -3));
  if (w.endsWith("ing")) tries.push(w.slice(0, -3), w.slice(0, -3) + "e", w.slice(0, -4));
  if (w.endsWith("er")) tries.push(w.slice(0, -2), w.slice(0, -1));
  if (w.endsWith("est")) tries.push(w.slice(0, -3), w.slice(0, -2));
  if (w.endsWith("ly")) tries.push(w.slice(0, -2), w.slice(0, -3) + "y");
  for (const t of tries) if (t.length > 1 && VOC.w[t]) return t;
  if (w.includes("-")) { const last = w.split("-").pop(); if (VOC.w[last]) return last; }
  return w;
}
function tiers(st) {
  if (tierCache[st.id]) return tierCache[st.id];
  const fs = [];
  for (const k in VOC.w) { const v = VOC.w[k], e = { m: v[0], f: v[1] }; if (st.inS(e) && !st.inB(e) && e.f > 0) fs.push(e.f); }
  fs.sort((a, b) => a - b);
  return tierCache[st.id] = [fs[Math.floor(fs.length / 3)] || 1e9, fs[Math.floor(fs.length * 2 / 3)] || 1e9];
}
function levelFor(raw, lemma, st) {
  if (!VOC || !lemma || STOP.has(lemma) || /\d/.test(raw)) return "";
  const e = entry(lemma);
  if (!e) return /^[A-Z]/.test(String(raw).replace(/^[^A-Za-z]+/, "")) ? "" : (/^[a-z][a-z'\-]+$/.test(lemma) && lemma.length > 2 ? "x" : "");
  if (st.inB(e)) return "b";
  if (!st.inS(e)) {
    const bases = [];
    if (lemma.endsWith("ily")) bases.push(lemma.slice(0, -3) + "y");
    if (lemma.endsWith("ly")) bases.push(lemma.slice(0, -2), lemma.slice(0, -2) + "e");
    if (lemma.endsWith("ness")) bases.push(lemma.slice(0, -4), lemma.slice(0, -5) + "y");
    if (lemma.endsWith("ful") || lemma.endsWith("less")) bases.push(lemma.replace(/(ful|less)$/, ""));
    if (lemma.startsWith("un") || lemma.startsWith("re")) bases.push(lemma.slice(2));
    for (const bw of bases) { const be = entry(bw); if (be && (st.inS(be) || st.inB(be))) return "l"; }
  }
  if (st.inS(e)) { const [t1, t2] = tiers(st); return !e.f ? "l" : e.f <= t1 ? "h" : e.f <= t2 ? "m" : "l"; }
  if (e.f > 0 && e.f <= 1000) return "b";            // very common words are never "超纲", even if a list tag is missing
  if (!e.m && e.f > 0 && e.f <= 3000) return "b";
  return "x";
}
function shortGloss(lemma) { const e = entry(lemma); if (!e) return ""; return e.tr.split("\n")[0].replace(/^[a-z]+\.\s*/, "").split("，")[0].slice(0, 7); }

/* ---------------- demo lessons (flagged on screen) ---------------- */
function ex(s, zh, p) {
  const tokens = s.split(" ").map(raw => { const m = raw.match(/^(.*?)\{([^}]*)\}$/); return m ? { t: m[1].replace(/_/g, " "), g: m[2] } : { t: raw.replace(/_/g, " "), g: "" }; });
  return { p, zh, en: tokens.map(t => t.t).join(" "), tokens };
}
const DEMO_A = {
  title_en: "The Map in the Old Box", title_cn: "旧盒子里的地图",

function normalise(d) {
  const sents = (Array.isArray(d.sentences) ? d.sentences : []).map((s, i) => {
    let tokens = Array.isArray(s.tokens) ? s.tokens.map(t => ({ t: String(t.t ?? t.w ?? ""), g: String(t.g ?? "") })).filter(t => t.t) : [];
    const en = String(s.en || tokens.map(t => t.t).join(" "));
    if (!tokens.length) tokens = en.split(/\s+/).filter(Boolean).map(t => ({ t, g: "" }));
    return { p: Number.isFinite(+s.p) ? +s.p : i, en, zh: String(s.zh || ""), tokens };
  });
  return {
    title_en: String(d.title_en || d.title || "Untitled"), title_cn: String(d.title_cn || ""), sentences: sents,
    notes: (Array.isArray(d.notes) ? d.notes : []).map(n => ({ type: NOTE_TYPES.includes(n.type) ? n.type : "要点", point: String(n.point || ""), explain: String(n.explain || ""), example: String(n.example || ""), quote: String(n.quote || "") })).filter(n => n.point),
    questions: Array.isArray(d.questions) ? d.questions : []
  };
}
const paragraphs = d => { const out = []; d.sentences.forEach(s => { (out[s.p] ||= []).push(s); }); return out.filter(Boolean); };
const wordTotal = d => d.sentences.map(s => s.en).join(" ").split(/\s+/).filter(w => /[A-Za-z]/.test(w)).length;
function annotate(d, settings, overrides = {}) {
  const st = levelOf(settings.level), targets = new Set(settings.words.map(lemmaOf));
  const rank = { x: 5, l: 4, m: 3, h: 2, b: 1, "": 0 };
  const clean = w => String(w).replace(/^[^A-Za-z]+|[^A-Za-z']+$/g, "").replace(/'s$/, "");
  const names = new Set();
  d.sentences.forEach(s => s.tokens.forEach((t, i) => { if (i > 0) t.t.split(" ").forEach(w => { const c = clean(w); if (/^[A-Z][a-z]/.test(c)) names.add(c); }); }));
  d.sentences.forEach(s => s.tokens.forEach(t => {
    if (!t.t.includes(" ") && names.has(clean(t.t))) { t.lem = ""; t.lv = ""; t.target = false; t.gShow = t.g; t.key = clean(t.t).toLowerCase(); applyOv(t); return; }
    let best = { lem: "", lv: "" }; t.target = false;
    t.t.split(" ").forEach(part => { const lem = lemmaOf(part), lv = levelFor(part, lem, st); if (targets.has(lem)) t.target = true; if (!best.lem || rank[lv] > rank[best.lv]) best = { lem, lv }; });
    t.lem = best.lem; t.lv = best.lv; t.key = t.lem || clean(t.t).toLowerCase();
    t.gShow = t.g || ((t.lv && t.lv !== "b") ? shortGloss(t.lem) : "");
    applyOv(t);
  }));
  function applyOv(t) { const o = overrides[t.key]; if (o === "off") t.lv = ""; else if (o === "on" && !t.lv) { t.lv = "p"; if (!t.gShow) t.gShow = shortGloss(t.lem); } }
}
function coreWords(d) {
  const order = { p: -1, x: 0, l: 1, m: 2, h: 3 }, picked = new Map();
  d.sentences.forEach(s => s.tokens.forEach(t => { if (t.target && t.lem && !picked.has(t.lem)) picked.set(t.lem, t); }));
  const rest = [];
  d.sentences.forEach(s => s.tokens.forEach(t => { if (t.lv in order && t.lem && !picked.has(t.lem) && !rest.find(r => r.lem === t.lem)) rest.push(t); }));
  rest.sort((a, b) => order[a.lv] - order[b.lv]);
  for (const t of rest) { if (picked.size >= 10) break; picked.set(t.lem, t); }
  current.settings.words.forEach(w => { const l = lemmaOf(w); if (!picked.has(l)) picked.set(l, { lem: l, lv: "", g: "", target: true }); });
  return [...picked.values()];
}

function rankVoice(v) {

  if (/online/i.test(n)) s += 15;

function noteRule(levelId) {
  const counts = { p1: "2-3 词组 and 1 句型, no 语法", p2: "2-3 词组, 1-2 句型 and at most 1 simple 语法 point", j: "3-4 词组, 1-2 句型 and 1-2 语法 points", s: "4-6 词组, 2 句型 and 2-3 语法 points", c: "5-7 词组, 2 句型 and 2-3 语法 points", i: "5-7 词组 (including useful collocations), 2 句型 and 2-3 语法 points" };
  return `"notes": teaching notes taken from the passage: ${counts[levelId] || counts.j}. Each note: "type" = "词组" (phrase or collocation), "句型" (sentence pattern) or "语法" (grammar point such as tense, voice, clauses, non-finite verbs, inversion, subjunctive — only ones that really appear in the passage); "point" = the phrase/pattern/grammar name; "explain" = clear Chinese explanation (for 语法, explain the rule and how it works in this sentence); "quote" = the exact sentence from the passage where it appears; "example" = a NEW short English example sentence.`;
}

function promptGenerate(st) {
  const lv = levelOf(st.level), gn = genreOf(st.genre);
  return `You are helping a Chinese English teacher build a reading lesson like a Chinese English-learning app.
Write ONE original English passage and annotate it.

Level: ${lv.desc}
Genre: ${gn.desc}
Length: about ${st.length} words (within 15%).
Topic: ${st.topic || "choose a topic that suits these students and these words"}
Target words (use EVERY one naturally at least once; inflected forms are fine): ${st.words.join(", ")}

Rules:
- Apart from the target words, keep vocabulary and grammar at the level above. Content must suit school students.
- "sentences": every sentence in order. "p" = paragraph index from 0 (2-5 paragraphs). "en" = the sentence. "zh" = natural Simplified Chinese translation of that sentence.
- "tokens": the sentence split IN ORDER so that joining "t" with single spaces gives back "en". Keep punctuation and quotation marks attached to the neighbouring word. A fixed phrase may be one token (e.g. "go back.").
  "g" = short Chinese meaning IN THIS CONTEXT (at most 6 characters); "" for articles, pronouns, "to", numbers and obvious function words.
- ${noteRule(st.level)}
- "questions": ${st.q > 0 ? `${st.q} multiple-choice reading comprehension questions in English, options labelled "A. ", "B. ", "C. ", "D. "; "answer" = the letter only; "explain" in Chinese says where the answer comes from. Mix detail, inference and main-idea questions.` : "an empty array."}

Reply with only this JSON object:
{"title_en":"","title_cn":"","sentences":[{"p":0,"en":"","zh":"","tokens":[{"t":"","g":""}]}],"notes":[{"type":"","point":"","explain":"","quote":"","example":""}],"questions":[{"q":"","options":["A. ","B. ","C. ","D. "],"answer":"","explain":""}]}`;
}
function promptEnrich(local, st) {

  return `You are helping a Chinese English teacher annotate an existing English reading passage for ${lv.label} students (${lv.desc}).
The passage is given sentence by sentence; each token is numbered.

${lines}

Return:
- "title_en": ${local.title_en && local.title_en !== "Untitled" ? `keep "${local.title_en}"` : "a short English title"}; "title_cn": its Chinese title.
- "sentences": one object per sentence, same order and count (${local.sentences.length}). "zh" = natural Simplified Chinese translation. "g" = an object mapping token number to a short Chinese meaning IN THIS CONTEXT (at most 6 characters), only for content words worth glossing; skip articles, pronouns, numbers and obvious function words.
- ${noteRule(st.level)}
- "questions": ${st.q > 0 ? `${st.q} multiple-choice reading comprehension questions in English, options labelled "A. "..."D. ", "answer" = letter only, "explain" in Chinese.` : "an empty array."}

Reply with only this JSON object:
{"title_en":"","title_cn":"","sentences":[{"zh":"","g":{"0":""}}],"notes":[{"type":"","point":"","explain":"","quote":"","example":""}],"questions":[{"q":"","options":["A. ","B. ","C. ","D. "],"answer":"","explain":""}]}`;
}
function splitArticle(text, title) {
  const paras = text.replace(/\r/g, "").split(/\n\s*\n|\n/).map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);
  const sentences = [];
  paras.forEach((p, pi) => {
    const parts = p.match(/[^.!?。！？]+(?:[.!?。！？]+["'”’)\]]*|$)/g) || [p];
    parts.map(s => s.trim()).filter(Boolean).forEach(s => sentences.push({ p: pi, en: s, zh: "", tokens: s.split(" ").filter(Boolean).map(t => ({ t, g: "" })) }));
  });
  return { title_en: title || "Untitled", title_cn: "", sentences: sentences.slice(0, 200), notes: [], questions: [] };
}

/* ---------------- run ---------------- */
const status = (msg, err) => { const s = $("#status"); s.textContent = msg; s.classList.toggle("err", !!err); };
function busy(on) { $("#btnGen").disabled = on; $("#aAgain").disabled = on; $("#btnStop").hidden = !on; }
async function run(fresh) {
  const words = parseWords($("#words").value);
  const base = { words, level, q: Number($("#qcount").value), mode };
  tab = "text";
  if (mode === "paste") {
    const text = $("#article").value.trim();
    if (!text) { status("先把文章贴进来。", true); $("#article").focus(); return; }
    const local = splitArticle(text, $("#pasteTitle").value.trim());
    const st = { ...base };
    render(local, st, false);
    if (!$("#enrich").checked) { saveRecent({ raw: local, settings: st }); status("排好了（只用了本地词库，没有整句翻译和题目）。"); return; }
    ctl = new AbortController(); busy(true);
    status("排好了，正在用 AI 补语境释义、翻译、笔记和题目…");
    try {
      const out = await callAI(promptEnrich(local, st), { signal: ctl.signal, fresh, onProgress: n => status(`正在补全注释…${n ? "已生成 " + n + " 个字符" : ""}`) });
      const merged = JSON.parse(JSON.stringify(local));
      merged.title_en = out.title_en || merged.title_en; merged.title_cn = out.title_cn || "";
      (out.sentences || []).forEach((s, i) => { const m = merged.sentences[i]; if (!m || !s) return; m.zh = String(s.zh || ""); const g = s.g || {}; Object.keys(g).forEach(k => { const t = m.tokens[+k]; if (t) t.g = String(g[k]).slice(0, 10); }); });
      merged.notes = out.notes || []; merged.questions = out.questions || [];
      render(merged, st, false); saveRecent({ raw: merged, settings: st });
      status("排好了，AI 注释也补上了。");
    } catch (e) { status(e && e.code === "cancelled" ? "已停止，先用本地词库的排版。" : errText(e) + "（先用本地词库的排版）", e && e.code !== "cancelled"); }
    finally { busy(false); }
    return;
  }
  const st = { ...base, genre, length: Number($("#length").value), topic: $("#topic").value.trim().slice(0, 60) };
  if (!words.length) { status("先填至少一个单词。", true); $("#words").focus(); return; }
  ctl = new AbortController(); busy(true);
  status("正在写课文和注释，通常要 30 秒到 2 分钟…");
  try {
    const out = await callAI(promptGenerate(st), { signal: ctl.signal, fresh, onProgress: n => status(`正在写…${n ? "已生成 " + n + " 个字符" : ""}`) });
    if (!out || !Array.isArray(out.sentences) || !out.sentences.length) throw { code: "invalid_json" };
    render(out, st, false); saveRecent({ raw: out, settings: st });
    const present = new Set(); current.data.sentences.forEach(s => s.tokens.forEach(t => t.target && present.add(t.lem)));
    const miss = words.filter(w => !present.has(lemmaOf(w))).length;
    status(miss ? `写好了，但有 ${miss} 个词没用上，可以点右边「换一篇」。` : "写好了。");
  } catch (e) { status(e && e.code === "cancelled" ? "已停止。" : errText(e), e && e.code !== "cancelled"); }
  finally { busy(false); }
}
$("#form").addEventListener("submit", e => { e.preventDefault(); run(false); });
$("#aAgain").addEventListener("click", () => run(true));
$("#btnStop").addEventListener("click", () => ctl?.abort());

/* ---------------- start ---------------- */
showDemo(0);
drawRecent();
syncApiForm();
fetch("data/vocab.json").then(r => { if (!r.ok) throw 0; return r.json(); }).then(j => {
  VOC = j; if (current) render(current.raw, current.settings, current.isExample);
}).catch(() => { const sb = $("#stats"); sb.lastChild && (sb.lastChild.textContent = "词库没加载上（需要和 data/vocab.json 放在一起，用网址打开）"); });
(async () => {
  const c = window.claude;
  if (!c || !c.use) {
    if (api.provider === "claude") api = { ...api, provider: "openrouter", base: PROVIDERS.openrouter.base, model: FREE_ROUTER };
    syncApiForm();
    refreshFree(false).then(() => { if (api.provider === "openrouter") fillFreeSelect(); }).catch(() => {});
    return;
  }
  const [s, d] = await Promise.all([c.use("sample"), c.use("downloads")]);
  sample = s; downloads = d;
  syncApiForm();
})();
</script>
